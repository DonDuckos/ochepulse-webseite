name: Deploy website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ochepulse-website-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'DonDuckos/ochepulse-webseite'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out website
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate deployable files
        shell: bash
        run: |
          set -euo pipefail

          test -d public
          test -f public/index.html
          test ! -L public/index.html
          test -s public/index.html
          grep -Eiq '<!doctype[[:space:]]+html|<html([[:space:]>])' public/index.html

          if find public -mindepth 1 ! -type f ! -type d -print -quit | grep -q .; then
            echo 'public/ may contain only regular files and directories.' >&2
            exit 1
          fi

          if find public -mindepth 1 -name .git -print -quit | grep -q .; then
            echo 'A nested .git directory may not be deployed.' >&2
            exit 1
          fi

          file_count="$(find public -type f | wc -l)"
          extracted_bytes="$(du -sb public | cut -f 1)"
          (( file_count > 0 && file_count <= 5000 ))
          (( extracted_bytes <= 209715200 ))

      - name: Configure restricted SSH connection
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.WEBSITE_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.WEBSITE_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/website_deploy_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/website_deploy_key" "$HOME/.ssh/known_hosts"

      - name: Deploy website
        shell: bash
        env:
          DEPLOY_HOST: ${{ vars.WEBSITE_DEPLOY_HOST }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]

          manifest_digest() {
            local root="$1"
            (
              cd "$root"
              while IFS= read -r -d '' file; do
                printf '%s\0' "$file"
                sha256sum "$file" | cut -d ' ' -f 1 | tr -d '\n'
                printf '\0'
              done < <(find . -type f -print0 | sort -z)
            ) | sha256sum | cut -d ' ' -f 1
          }

          local_manifest="$(manifest_digest public)"
          deploy_output="$(
            tar -C public -czf - . \
              | ssh \
                  -i "$HOME/.ssh/website_deploy_key" \
                  -o BatchMode=yes \
                  -o ConnectTimeout=15 \
                  -o IdentitiesOnly=yes \
                  -o StrictHostKeyChecking=yes \
                  -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
                  "donduck@$DEPLOY_HOST"
          )"
          printf '%s\n' "$deploy_output"

          remote_manifest="$(
            printf '%s\n' "$deploy_output" \
              | sed -n 's/^DEPLOYED_MANIFEST_SHA256=//p' \
              | tail -n 1
          )"
          test -n "$remote_manifest"
          test "$local_manifest" = "$remote_manifest"

      - name: Verify public website
        shell: bash
        run: |
          set -euo pipefail
          downloaded="$(mktemp)"
          trap 'rm -f "$downloaded"' EXIT

          curl --fail --silent --show-error \
            --retry 5 --retry-delay 2 --retry-all-errors \
            https://ochepulse.de/ -o "$downloaded"

          test "$(sha256sum public/index.html | cut -d ' ' -f 1)" = \
            "$(sha256sum "$downloaded" | cut -d ' ' -f 1)"

      - name: Remove SSH key
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/website_deploy_key"
