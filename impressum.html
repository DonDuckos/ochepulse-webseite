<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Impressum — OchePulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;800&family=Archivo+Narrow:wght@700&display=swap" rel="stylesheet">
<style>
  :root{ --ink1000:#08080A; --ink:#F4F2EE; --ink-muted:#9B988F; --amber500:#FF6A2B; --hairline:rgba(244,242,238,0.09); }
  body{ background:var(--ink1000); color:var(--ink); font-family:"Archivo",system-ui,sans-serif; line-height:1.6; margin:0; }
  .wrap{ max-width:640px; margin:0 auto; padding:56px 24px 80px; }
  h1{ font-weight:800; font-size:27px; letter-spacing:-0.025em; margin:0 0 24px; }
  .placeholder{
    border:1px solid var(--hairline); border-radius:20px; padding:20px;
    color:var(--ink-muted); font-size:15px;
  }
  a{ color:var(--amber500); text-decoration:none; }
  .back{ display:inline-block; margin-bottom:32px; font-size:13px; color:var(--ink-muted); }
</style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="/">← Zurück</a>
    <h1>Impressum</h1>
    <p class="placeholder">Diese Seite ist noch nicht vollständig. Ein rechtsgültiges Impressum braucht die realen Angaben des Betreibers (Name, Anschrift, Kontakt) — die sind hier bewusst noch nicht eingetragen, statt Platzhalter als echte Angaben auszugeben.</p>
  </div>
</body>
</html>
